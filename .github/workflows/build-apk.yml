name: Deploy Web to GitHub Pages & Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # ─── 1. Deploy Web to GitHub Pages (Live Auto-Update Backend) ───
  deploy-pages:
    name: Deploy to GitHub Pages (Auto-Updates)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://udfbawtsfqvrxuyzahfh.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkZmJhd3RzZnF2cnh1eXphaGZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTE4MTIsImV4cCI6MjA4OTc2NzgxMn0.avEL0g9y2qLmz54NQ1uhf0_hW-mq-Sjm4V648x6ysVk' }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ─── 2. Build Native Android APK (Standalone 404-Free Offline & Online) ───
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://udfbawtsfqvrxuyzahfh.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVkZmJhd3RzZnF2cnh1eXphaGZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTE4MTIsImV4cCI6MjA4OTc2NzgxMn0.avEL0g9y2qLmz54NQ1uhf0_hW-mq-Sjm4V648x6ysVk' }}
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Somity-OneTime-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
