name: Deploy Web to GitHub Pages & Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  # ─── 1. Deploy Web to gh-pages (source of Capacitor live app) ───
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

  # ─── 2. Build Native Android APK (only when explicitly requested) ───
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[apk]') ||
      contains(github.event.head_commit.message, 'feat(updater)')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Sync Capacitor
        run: npm run cap:sync

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Publish versioned APK to public/
        run: node scripts/publish-apk.cjs

      - name: Read app version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=digitalsomity-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Digital-Somity-v${{ steps.ver.outputs.version }}
          path: public/${{ steps.ver.outputs.apk }}
          retention-days: 30

      - name: Commit versioned APK to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/${{ steps.ver.outputs.apk }} public/digitalsomity.apk public/version.json || true
          if git diff --cached --quiet; then
            echo "No APK changes to commit"
          else
            git commit -m "chore: publish ${{ steps.ver.outputs.apk }}"
            git push
          fi
